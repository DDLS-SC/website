name: Add or update your profile
description: Add yourself to the People page, or correct your entry.
title: "[Profile] "
labels: ["profile"]
body:
  - type: markdown
    attributes:
      value: |
        Everything you enter here is shown publicly on the People page. Leave out anything you don't want listed.
        To be removed, open an issue or email the council and we'll delete your entry.
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: dropdown
    id: university
    attributes:
      label: University
      options:
        - Karolinska Institutet
        - KTH Royal Institute of Technology
        - Stockholm University
        - Uppsala University
        - Swedish University of Agricultural Sciences
        - Linköping University
        - Umeå University
        - University of Gothenburg
        - Chalmers University of Technology
        - Lund University
    validations:
      required: true
  - type: dropdown
    id: ra
    attributes:
      label: DDLS research area
      options:
        - Cell and molecular biology (CMB)
        - Evolution and biodiversity (EB)
        - Precision medicine and diagnostics (PMD)
        - Epidemiology and biology of infection (EBI)
    validations:
      required: true
  - type: input
    id: cohort
    attributes:
      label: Cohort (year you joined the Research School)
      placeholder: "2025"
    validations:
      required: true
  - type: input
    id: affiliation_note
    attributes:
      label: Partner company or organisation (optional)
      description: For example if you are an industrial PhD student.
  - type: input
    id: email
    attributes:
      label: Email address to show (optional)
  - type: input
    id: linkedin
    attributes:
      label: LinkedIn (optional)
  - type: input
    id: github
    attributes:
      label: GitHub (optional)
  - type: input
    id: ggscholar
    attributes:
      label: Google Scholar (optional)
  - type: input
    id: orcid
    attributes:
      label: ORCID iD (optional)
      placeholder: https://orcid.org/0000-0000-0000-0000
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: I agree that the information above is shown publicly on the website until I ask for it to be removed.
          required: true
