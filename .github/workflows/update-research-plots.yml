name: Update research plots

# Friday 00:00 UTC (≈ Friday 01:00 CET / 02:00 CEST)
on:
  schedule:
    - cron: "0 0 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-research-plots
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache OpenAlex responses
        uses: actions/cache@v4
        with:
          path: research/.cache
          key: openalex-${{ github.run_id }}
          restore-keys: |
            openalex-

      - name: Update student publication DOIs from ORCID
        run: python script/update_student_publications.py --delay 0.25

      - name: Regenerate research SVG plots
        run: python script/plot_research_overview.py --refresh-cache --delay 0.12

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student research/*.svg research/summary.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update research plots and student publication DOIs"
          git push
